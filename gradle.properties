android.useAndroidX=true
# Enable Jetifier to convert old libraries to AndroidX if needed
android.enableJetifier=true

# The Gradle daemon defaults to a 512 MiB heap, which is not enough to compile
# Kotlin + Compose + KSP in one run: CI failed with "Gradle build daemon has been
# stopped: since the JVM garbage collector is thrashing". This is easy to miss
# locally, because --no-daemon runs in the client JVM instead, whose default max
# heap is a quarter of physical RAM and so happens to be large enough.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
